[project]
name = "agent-eval-adapters"
version = "0.0.0"
description = "EvalForge Adapter Layer — SDK + vendor adapters (translation only)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agent-eval-shared",
  "agent-eval-domain",
  "agent-eval-sandbox",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agent_eval_adapters"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_eval_adapters" = "agent_eval_adapters"

[tool.uv.sources]
agent-eval-shared = { workspace = true }
agent-eval-domain = { workspace = true }
agent-eval-sandbox = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "src",
  "../shared/src",
  "../domain/src",
  "../sandbox/src",
  "tests",
]
addopts = ["-q", "--strict-markers"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
]
