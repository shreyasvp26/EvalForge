[project]
name = "agent-eval-sandbox"
version = "0.0.0"
description = "EvalForge Sandbox Runtime — isolated Docker execution only"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agent-eval-shared",
  "docker>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agent_eval_sandbox"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_eval_sandbox" = "agent_eval_sandbox"

[tool.uv.sources]
agent-eval-shared = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../shared/src", "tests"]
addopts = ["-q", "--strict-markers"]
markers = [
  "integration: requires a live Docker daemon",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
]
