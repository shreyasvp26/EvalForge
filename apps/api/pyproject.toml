[project]
name = "agent-eval-api"
version = "0.1.0"
description = "EvalForge Control Plane — FastAPI HTTP surface over Application use cases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agent-eval-shared",
  "agent-eval-domain",
  "agent-eval-application",
  "agent-eval-infrastructure",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.28.0",
  "pyjwt>=2.9.0",
]

[project.scripts]
evalforge-api = "agent_eval_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval_api"]

[tool.uv.sources]
agent-eval-shared = { workspace = true }
agent-eval-domain = { workspace = true }
agent-eval-application = { workspace = true }
agent-eval-infrastructure = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = ["-q", "--strict-markers"]
