[project]
name = "agent-eval-api"
version = "0.0.0"
description = "HTTP API for the Coding Agent Evaluation Platform (scaffold only)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agent-eval-shared",
  "agent-eval-domain",
  "agent-eval-application",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval_api"]

[tool.uv.sources]
agent-eval-shared = { workspace = true }
agent-eval-domain = { workspace = true }
agent-eval-application = { workspace = true }
