[project]
name = "agent-eval"
version = "0.0.0"
description = "EvalForge — Python workspace root"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "black>=24.10.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]

[tool.uv.workspace]
members = [
  "apps/api",
  "workers",
  "shared",
  "domain",
  "application",
  "infrastructure",
  "sandbox",
  "adapters",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '''
/(
  \.git
  | \.venv
  | node_modules
  | dist
  | build
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
  ".venv",
  "node_modules",
  "dist",
  "build",
]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "UP",
]

[tool.pytest.ini_options]
testpaths = [
  "shared/tests",
  "domain/tests",
  "application/tests",
  "infrastructure/tests",
  "workers/tests",
  "sandbox/tests",
  "adapters/tests",
  "apps/api/tests",
]
pythonpath = [
  "shared/src",
  "domain/src",
  "domain/tests",
  "application/src",
  "application/tests",
  "infrastructure/src",
  "infrastructure/tests",
  "workers/src",
  "workers/tests",
  "sandbox/src",
  "sandbox/tests",
  "adapters/src",
  "adapters/tests",
  "apps/api/src",
  "apps/api/tests",
]
addopts = ["-q", "--strict-markers"]
markers = [
  "integration: requires a live Docker daemon",
]

[tool.coverage.run]
source = [
  "agent_eval_shared",
  "agent_eval_domain",
  "agent_eval_application",
  "agent_eval_infrastructure",
  "agent_eval_workers",
  "agent_eval_sandbox",
  "agent_eval_adapters",
  "agent_eval_api",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
