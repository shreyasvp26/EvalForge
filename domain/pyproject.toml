[project]
name = "agent-eval-domain"
version = "0.0.0"
description = "EvalForge Domain Layer — pure business model, no infrastructure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agent-eval-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agent_eval_domain"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_eval_domain" = "agent_eval_domain"

[tool.uv.sources]
agent-eval-shared = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["-q", "--strict-markers"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
]
