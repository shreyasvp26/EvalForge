[project]
name = "agent-eval-application"
version = "0.0.0"
description = "EvalForge Application Layer — use-case orchestration over the Domain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agent-eval-shared",
  "agent-eval-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agent_eval_application"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_eval_application" = "agent_eval_application"

[tool.uv.sources]
agent-eval-shared = { workspace = true }
agent-eval-domain = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../domain/src", "../shared/src", "tests"]
addopts = ["-q", "--strict-markers"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
]
